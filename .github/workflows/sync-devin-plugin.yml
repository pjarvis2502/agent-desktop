name: sync-devin-plugin

on:
  push:
    branches: [main]
    paths:
      - skills/agent-desktop/**
      - skills/agent-desktop-linux/**
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy skills into devin-plugin
        run: |
          for s in agent-desktop agent-desktop-linux; do
            rm -rf "devin-plugin/skills/$s"
            cp -r "skills/$s" "devin-plugin/skills/$s"
          done
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain devin-plugin)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add devin-plugin
            git commit -m "chore: sync devin-plugin skills from skills/"
            git push
          fi
